name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: academic-arena-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Build, security, and baseline tests
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-test.txt

      - name: Install pinned dependencies
        run: |
          npm ci
          python -m pip install --disable-pip-version-check -r requirements.txt -r requirements-test.txt

      - name: Test secret scanner
        run: python -m unittest discover -s tests -p test_check_secrets.py

      - name: Test frontend contracts and builds
        run: |
          npm test
          npm run build:demo
          npm run build:production

      - name: Install Chromium for local Pages smoke tests
        run: npx playwright install --with-deps chromium

      - name: Test desktop and mobile Pages preview
        run: npm run test:browser

      - name: Scan source and production bundle
        run: npm run check:security

      - name: Run retained FastAPI baseline tests
        run: python tests/smoke_api.py
