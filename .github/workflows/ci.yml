name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: academic-arena-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Build, security, and baseline tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-test.txt

      - name: Install pinned dependencies
        run: |
          npm ci
          python -m pip install --disable-pip-version-check -r requirements.txt -r requirements-test.txt

      - name: Test secret scanner
        run: python -m unittest discover -s tests -p test_check_secrets.py

      - name: Test frontend contracts and builds
        run: |
          npm test
          npm run build:demo
          npm run build:production

      - name: Install Chromium for local Pages smoke tests
        run: npx playwright install --with-deps chromium

      - name: Test desktop and mobile Pages preview
        run: npm run test:browser

      - name: Scan source and production bundle
        run: npm run check:security

      - name: Run retained FastAPI baseline tests
        run: python tests/smoke_api.py
